name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nada de cache: o trabalho aqui é só verificação, e Rodar tudo em paralelo
# mantém o pipeline em ~1 minuto.
jobs:
  sintaxe:
    name: sintaxe (bash -n)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      # ATENÇÃO: "bash -n f1 f2 f3" só valida o PRIMEIRO arquivo (os demais
      # virariam $1, $2...). Por isso o loop.
      - name: bash -n em todos os scripts
        shell: bash
        run: |
          # assets/bin/omyfedora-seapplet é Python; validar só quem tem shebang shell.
          scripts=()
          for f in install.sh bootstrap.sh pessoal-pc.sh lib/common.sh scripts/*.sh assets/bin/* assets/libexec/*; do
            first="$(head -n1 "$f")"
            case "$first" in
              *bash*|*'/sh'*|*dash*|*ksh*) scripts+=("$f") ;;
              *) echo "ignorando (não é shell): $f" ;;
            esac
          done
          for f in "${scripts[@]}"; do
            bash -n "$f" || exit 1
          done
          echo "sintaxe OK em ${#scripts[@]} arquivo(s) shell"

  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: instala o shellcheck
        run: dnf -q -y install ShellCheck
      - name: shellcheck (severidade warning ou maior)
        shell: bash
        run: |
          # O applet é Python; shellcheck só recebe os arquivos com shebang shell.
          scripts=()
          for f in install.sh bootstrap.sh pessoal-pc.sh lib/common.sh scripts/*.sh assets/bin/* assets/libexec/*; do
            first="$(head -n1 "$f")"
            case "$first" in
              *bash*|*'/sh'*|*dash*|*ksh*) scripts+=("$f") ;;
            esac
          done
          shellcheck -S warning "${scripts[@]}"

  dry-run:
    name: dry-run (instalação simulada)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      # As etapas precisam de um usuário-alvo (UID >= 1000) para configurar;
      # num container como root, resolve_target_user não acharia nenhum.
      # shadow-utils (useradd) já desapareceu da imagem base em algumas
      # versões do Fedora; instala se faltar.
      - name: cria usuário de teste
        run: |
          command -v useradd >/dev/null || dnf -y -q install shadow-utils
          useradd -m -u 1000 ci
      - name: ./install.sh --dry-run --user ci
        run: ./install.sh --dry-run --user ci
