# MyOS — Alacritty: tema macOS (Liquid Glass)
#
# Cores espelhadas do bloco `terminal` (variante dark) de
# assets/noctalia/palettes/macOS.json, para terminal e shell combinarem.
# ATENÇÃO: a cópia é MANUAL. Se a paleta do Noctalia mudar, este arquivo
# precisa ser atualizado junto — não existe integração automática.
#
# Fonte sugerida: jetbrains-mono-fonts (instalada por 20-stack.sh).

[window]
padding = { x = 1, y = 1 }

# Translúcido, no mesmo espírito da barra do Noctalia. Exige a window-rule do
# Alacritty em assets/niri/config.kdl: ela liga o blur atrás da janela
# (background-effect, recurso do niri 26.04+) e desativa o anel de foco
# desenhado atrás da janela, que senão apareceria como um tom escuro
# atravessando a transparência.
opacity = 0.85

dynamic_title = true

[scrolling]
history = 10000

[font]
size = 11.5

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[cursor]
style = { shape = "Beam", blinking = "Off" }

[colors.primary]
background = "#0B0B0D"
foreground = "#F5F5F7"

[colors.cursor]
cursor = "#F5F5F7"
text = "#0B0B0D"

[colors.selection]
background = "#1F1F22"
foreground = "#F5F5F7"

[colors.normal]
black = "#1C1C1E"
red = "#FF453A"
green = "#32D74B"
yellow = "#FFD60A"
blue = "#0A84FF"
magenta = "#BF5AF2"
cyan = "#64D2FF"
white = "#C7C7CC"

[colors.bright]
black = "#3A3A3C"
red = "#FF6961"
green = "#4CD964"
yellow = "#FFE066"
blue = "#409CFF"
magenta = "#DA8FFF"
cyan = "#70D7FF"
white = "#F5F5F7"
