# msbos — greetd (display manager)
# __GREETER_CMD__ é substituído na instalação:
#   - com noctalia-greeter: "/usr/bin/env NOCTALIA_GREETER_ASSETS_DIR=...
#     /usr/bin/noctalia-greeter-session -- --session niri" (mascote do msbos)
#   - sem:                  "greetd" (greeter padrão em texto)

[terminal]
vt = 1

[default_session]
command = "__GREETER_CMD__"
user = "greeter"
