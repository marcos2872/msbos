# MyOS — configuração do Noctalia v5
#
# Os padrões da instalação já são funcionais (barra, launcher, notificações,
# lock screen, OSD). Use a interface gráfica de configuração do próprio shell
# ou edite este arquivo.
#
# Referência completa: https://docs.noctalia.dev
# Dica MyOS: para trocar o papel de parede, coloque imagens em
#   ~/.config/myos-walls/   (usuário)
#   /usr/share/myos-walls/  (sistema)
# e o helper myos-wallpaper (swaybg) usa a primeira delas no próximo login.
