# MyOS — nota sobre a configuração do Noctalia v5
#
# O Noctalia v5 NÃO lê este arquivo: a configuração real fica em
#   ~/.local/state/noctalia/settings.toml
# (gerenciada pela interface gráfica do próprio shell).
#
# Os defaults do MyOS (layout da barra, plugin system-monitor, wallpaper)
# estão em assets/noctalia/settings.toml + assets/noctalia/plugins/ do
# repositório e são instalados pelo 50-configs.sh somente quando ainda
# não existem — sua personalização nunca é sobrescrita.
#
# Referência completa: https://docs.noctalia.dev
