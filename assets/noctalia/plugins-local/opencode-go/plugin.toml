id = "msbos/opencode-go"
name = "OpenCode Go"
version = "0.1.0"
plugin_api = 24
author = "msbos"
license = "MIT"
icon = "code"
description = "Cotas do plano OpenCode Go: janela de 5 horas, semanal e mensal."
tags = ["bar", "panel", "service", "opencode", "usage"]
dependencies = ["opencode", "sqlite3"]

[[setting]]
key = "refresh"
type = "int"
label_key = "settings.refresh.label"
description_key = "settings.refresh.description"
default = 300
min = 60
max = 900

[[widget]]
id = "status"
entry = "bar.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 380
height = 400
placement = "attached"
open_near_click = true
dismiss_on_outside_click = true

[[service]]
id = "poll"
entry = "service.luau"
