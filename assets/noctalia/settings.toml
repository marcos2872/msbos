# omyfedora — defaults do Noctalia v5 (instalados em ~/.local/state/noctalia/)
#
# O que vai aqui:
#   - layout da barra ([bar.default])
#   - plugins habilitados ([plugins] — o código fica em plugins/)
#   - ajustes de widgets ([widget.*]) e wallpaper padrão
#
# O que NÃO vai (criado em runtime, específico da máquina):
#   - [lockscreen_widgets] (geometria por monitor — o Noctalia cria sozinho)
#   - [wallpaper.monitors.*] (idem)
#   - state.toml, usage_counts.json, clipboard, plugin-cache, sources/
#     (estado/estatísticas/cache — o Noctalia gera e baixa sozinho)
#
# Instalação: 50-configs.sh copia este arquivo e plugins/ somente se ainda
# não existirem no destino — uma config já personalizada nunca é sobrescrita.
#
# Atenção: o ESTILO do tema (barra, dock, painéis, paleta) NÃO vai aqui — vai
# em assets/noctalia/config.toml. Este arquivo é só o que a GUI reescreve.
config_version = 15

[bar.default]
center = [ "clock", "media" ]
end = [
    "tray",
    "group:g1",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "session"
]
# taskbar sai da barra: o dock (config.toml) assume os apps abertos.
# cpu/ram ficam num grupo cápsula (g1) no end, depois do tray.
# O control center fica no início; o launcher continua acessível por atalho
# (Super+Space), mas não aparece como widget da barra (ver [widget.launcher]).
start = [ "control-center", "workspaces" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram" ]
    opacity = 0.60000002384185791
    padding = 6.0

[plugins]
enabled = [ "tmelik/system-monitor", "raycursive/niri-displays" ]

[shell]
app_icon_color = "secondary"

# Mesmo wallpaper usado como padrão do omyfedora (instalado pelo 50-configs.sh
# em /usr/share/omyfedora-walls/). As entradas por monitor são criadas em runtime.
[wallpaper.default]
path = "/usr/share/omyfedora-walls/wp11280214-rx7-4k-wallpapers.jpg"

[wallpaper.last]
path = "/usr/share/omyfedora-walls/wp11280214-rx7-4k-wallpapers.jpg"

[widget.cpu]
# Dentro do grupo cápsula g1: gráfico, sem o valor numérico ao lado.
show_value = false
visualization = "graph"

[widget.launcher]
# O launcher não ocupa a barra; continua no atalho Super+Space.
enabled = false

[widget.media]
hide_when_no_media = true
max_length = 108
rotate_album_art = true

[widget.network]
show_label = false

[widget.ram]
# Dentro do grupo cápsula g1: gráfico, sem o valor numérico ao lado.
show_value = false
visualization = "graph"
