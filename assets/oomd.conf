# msbos — systemd-oomd
#
# Age ANTES do kernel OOM travar a máquina: com zram, o swap enche rápido e
# o oomd mata o processo faminto de forma controlada (via cgroup).
#
# ATENÇÃO: a seção é [OOM] e as chaves são as do oomd.conf(5). Com qualquer
# outra grafia o systemd descarta o arquivo inteiro no boot ("Unknown section
# 'oomd'. Ignoring.") e o tuning nunca vale — foi o que aconteceu até o
# Fedora 45 com uma versão anterior deste asset.
#
# Os limites abaixo são mais agressivos que o padrão (SwapUsedLimit=90%,
# DefaultMemoryPressureLimit=60%): o msbos prefere despejar um processo grande
# cedo a deixar a máquina inteira travada.
#
# DefaultMemoryPressureDurationSec não aparece aqui de propósito: o drop-in do
# pacote (/usr/lib/systemd/oomd.conf.d/10-oomd-defaults.conf) já fixa 20s e
# drop-in tem precedência sobre este arquivo.
[OOM]
SwapUsedLimit=40%
DefaultMemoryPressureLimit=50%
