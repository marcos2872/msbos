# omyfedora — tuning de memória (baixo consumo de RAM)
#
# Com zram (swap comprimido e rápido), um swappiness mais alto é seguro:
# mantém mais páginas frias comprimidas e libera RAM física.
vm.swappiness=60
vm.vfs_cache_pressure=50

# Reserva mínima de memória livre — calculado na instalação (1/64 da RAM).
vm.min_free_kbytes=__MINFREE__
