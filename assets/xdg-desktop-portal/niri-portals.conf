# msbos — portal do niri com o seletor de arquivos no backend GTK.
#
# O backend GNOME (instalado para o ScreenCast) implementa FileChooser
# delegando ao Nautilus, que o msbos não instala. O GTK tem seletor próprio.
# Mantemos o GNOME como padrão para o ScreenCast e roteamos FileChooser ao GTK.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
