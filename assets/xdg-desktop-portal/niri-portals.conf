# msbos — portal do niri com o seletor de arquivos no backend GTK.
#
# O backend GNOME (instalado para o ScreenCast) implementa FileChooser
# delegando ao Nautilus, que o msbos não instala. O GTK tem seletor próprio.
# Mantemos o GNOME como padrão para o ScreenCast e roteamos FileChooser ao GTK.
#
# Secret: o cofre do msbos é o KWallet, então ele vem primeiro. O
# kwallet.portal (do kf6-kwallet) expõe a interface Secret e aponta para o
# ksecretd, que publica org.freedesktop.secrets na sessão (ver a etapa
# 50-configs). O upstream do niri pede "gnome-keyring", mas o gnome-keyring
# não faz parte do stack e, sem o pacote, a entrada era letra morta; só a
# partir do Fedora 45 o gnome-keyring passou a entregar o próprio
# gnome-keyring.portal. Ele fica como fallback, depois do kwallet.
#
# Cada chave é uma lista separada por ';' — os backends vão sendo tentados na
# ordem, e quem não estiver instalado é pulado.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=kwallet;gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
