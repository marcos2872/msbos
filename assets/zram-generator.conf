# omyfedora — zram: swap comprimido em RAM (zstd)
#
# ATENÇÃO: o path correto é /etc/systemd/zram-generator.conf —
# o zram-generator ignora /etc/zram-generator.conf.
#
# Mais rápido que swap em disco, reduz I/O e evita travar quando a RAM aperta.
# ~Metade da RAM (no máximo 8 GiB) vira swap comprimido (ganho real ~2-3x).
# Sintaxe: é uma expressão do zram-generator — "50%" NÃO é porcentagem (o "%"
# é o operador de módulo: o parser falha com EofWhileParsing e o sistema fica
# sem swap). A forma correta é a divisão: ram / 2.
# O generator cria e liga as units no boot (swap.target → dev-zram0.swap).
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
